name: Release

# Push a version tag (e.g. v0.1.1) AFTER bumping package.json + tauri.conf.json
# to the same version and committing. Builds Windows MSI, creates a GitHub
# Release with auto-generated notes, and uploads a portable ZIP.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { throw "Tag must start with v (got $tag)" }
          $expected = $tag.Substring(1)
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $expected -or $tauri -ne $expected) {
            throw @"
Tag $tag must match the app version.
  package.json          = $pkg
  tauri.conf.json       = $tauri
  expected (from tag)   = $expected

Bump both version fields, commit, then create/push the tag.
"@
          }
          Write-Host "OK: tag $tag matches app version $expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI and create GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IPScan ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            | Asset | Use when |
            |-------|----------|
            | **`.msi`** | Permanent install (Start Menu, Add/Remove Programs) |
            | **`IPScan-portable-*.zip`** | Temporary / portable — extract and run; no install |

            See auto-generated notes below for what changed in this version.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart("v") }
          $exe = "src-tauri/target/release/ipscan.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe — Tauri build did not produce the binary." }
          $zip = "IPScan-portable-v${version}-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created $zip"

      - name: Upload portable ZIP to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Always attach to the same tag that triggered this workflow
          # (and that tauri-action used for the release).
          gh release upload "${{ github.ref_name }}" $env:PORTABLE_ZIP --clobber
