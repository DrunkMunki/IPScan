[package]
name = "ipscan"
version = "0.1.0"
description = "Company-internal IP and TCP port scanner"
authors = ["Simon Hughes"]
edition = "2021"

[lib]
name = "ipscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
futures = "0.3"
ipnet = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
thiserror = "2"
dns-lookup = "2"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
winreg = "0.55"
getifaddrs = "0.6.2"
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
x509-parser = "0.18.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }

# Production builds must enable custom-protocol so the UI is served from
# embedded assets instead of http://localhost:1420 (Vite).
# `tauri dev` runs with --no-default-features to use the live Vite server.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
